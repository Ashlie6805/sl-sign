
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: white;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #name {
        color: black;
        font-size: 90px;
        font-weight: bold;
        text-align: center;
        overflow-wrap: anywhere;
        padding: 20px;
    }
</style>
</head>
<body>
    <div id="name">CLICK TO SIGN UP</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get("name");

        document.getElementById("name").textContent =
            name || "CLICK TO SIGN UP";
    </script>
</body>
</html>
